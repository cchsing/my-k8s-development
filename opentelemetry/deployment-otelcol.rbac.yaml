apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-otelcol-collector
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-otelcol-collector
subjects:
  - kind: ServiceAccount
    name: deployment-otelcol-collector
    namespace: otel-collectors
roleRef:
  kind: ClusterRole
  name: deployment-otelcol-collector
  apiGroup: rbac.authorization.k8s.io